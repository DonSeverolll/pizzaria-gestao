<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Lucro - PL Pizzas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="admin-page">
      <button id="adminMenuToggle" class="admin-menu-toggle" type="button" aria-expanded="false" aria-label="Abrir menu administrativo">
        ☰
      </button>

      <aside id="adminSidebar" class="admin-sidebar open">
        <div class="admin-brand">
          <img class="brand-logo brand-logo-admin" src="/logo-pl-real.png" alt="Logo PL Pizzas" />
          <div>
            <strong>PL Pizzas</strong>
            <small>Admin</small>
          </div>
        </div>

        <nav class="admin-nav" aria-label="Menu administrativo">
          <a href="/admin" class="admin-nav-item">Dashboard</a>
          <a href="/admin-mesas.html" class="admin-nav-item">Gerenciamento de Mesas e Cadeiras</a>
          <a href="/admin-clientes.html" class="admin-nav-item">Clientes Cadastrados</a>
          <a href="/admin-produtos.html" class="admin-nav-item">Produtos</a>
          <a href="/admin-pedidos.html" class="admin-nav-item">Pedidos</a>
          <a href="/admin-estoque.html" class="admin-nav-item">Estoque</a>
          <a href="/admin-lucro.html" class="admin-nav-item active">Dashboard de Lucro</a>
          <a href="/admin-config.html" class="admin-nav-item">Configurações</a>
        </nav>
      </aside>

      <main class="admin-content">
        <header class="admin-header">
          <div>
            <span class="eyebrow">Lucro</span>
            <h1 style="margin: 0;">Dashboard de lucro</h1>
          </div>
          <a href="/admin" class="button ghost">Voltar</a>
        </header>

        <section class="admin-card" id="reportFilters">
          <div class="type-actions" style="margin-top: 0;">
            <button class="inline-button primary" data-period="today" type="button">Hoje</button>
            <button class="inline-button" data-period="7d" type="button">Últimos 7 dias</button>
            <button class="inline-button" data-period="month" type="button">Mês atual</button>
            <button class="inline-button" data-period="custom" type="button">Período personalizado</button>
          </div>

          <div id="customRange" class="two-columns hidden" style="margin-top: 14px;">
            <input id="rangeFrom" type="date" />
            <input id="rangeTo" type="date" />
          </div>
          <button id="applyCustomRange" class="button ghost hidden" type="button" style="margin-top: 10px;">Aplicar período</button>
        </section>

        <section class="summary-grid" id="summaryGrid" style="margin-top: 18px;">
          <div class="summary-card">
            <span class="label">Faturamento total</span>
            <strong id="summaryRevenue">R$ 0,00</strong>
          </div>
          <div class="summary-card">
            <span class="label">Total de pedidos</span>
            <strong id="summaryOrders">0</strong>
          </div>
          <div class="summary-card">
            <span class="label">Ticket médio</span>
            <strong id="summaryTicket">R$ 0,00</strong>
          </div>
          <div class="summary-card">
            <span class="label">Período</span>
            <strong id="summaryPeriod">Hoje</strong>
          </div>
        </section>

        <section class="admin-card" style="margin-top: 18px;">
          <div class="admin-header" style="margin-bottom: 12px;">
            <div>
              <h2 style="margin: 0;">Curva ABC de produtos</h2>
            </div>
            <div class="type-actions" style="margin-top: 0;">
              <button id="exportCsvButton" class="button ghost" type="button">Exportar CSV</button>
              <button id="exportPdfButton" class="button ghost" type="button">Exportar PDF</button>
            </div>
          </div>
          <div id="productsTable" class="orders-table"></div>
        </section>
      </main>
    </div>

    <script src="/admin-lucro.js"></script>
  </body>
</html>
