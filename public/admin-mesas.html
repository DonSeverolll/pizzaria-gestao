<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciamento de Mesas e Cadeiras - PL Pizza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="admin-page">
      <button id="adminMenuToggle" class="admin-menu-toggle" type="button" aria-expanded="false" aria-label="Abrir menu administrativo">
        ☰
      </button>

      <aside id="adminSidebar" class="admin-sidebar open">
        <div class="admin-brand">
          <img class="brand-logo brand-logo-admin" src="/logo-pl-real.png" alt="Logo PL Pizza" />
          <div>
            <strong>PL Pizza</strong>
            <small>Admin</small>
          </div>
        </div>

        <nav class="admin-nav" aria-label="Menu administrativo">
          <a href="/admin" class="admin-nav-item">Dashboard</a>
          <a href="/admin-mesas.html" class="admin-nav-item active">Gerenciamento de Mesas e Cadeiras</a>
          <a href="/admin-clientes.html" class="admin-nav-item">Clientes Cadastrados</a>
          <a href="/admin-produtos.html" class="admin-nav-item">Produtos</a>
          <a href="/admin-pedidos.html" class="admin-nav-item">Pedidos</a>
          <a href="/admin-estoque.html" class="admin-nav-item">Estoque</a>
          <a href="/admin-lucro.html" class="admin-nav-item">Dashboard de Lucro</a>
          <a href="/admin-config.html" class="admin-nav-item">Configurações</a>
        </nav>
      </aside>

      <main class="admin-content">
        <header class="admin-header">
          <div>
            <span class="eyebrow">Mesas</span>
            <h1 style="margin: 0;">Gerenciamento de mesas e cadeiras</h1>
          </div>
          <a href="/admin" class="button ghost">Voltar</a>
        </header>

        <section class="admin-card">
          <div class="table-form">
            <input id="tableName" type="text" placeholder="Nome da mesa (ex.: Mesa 06)" />
            <input id="tableCapacity" type="number" min="1" max="12" placeholder="Capacidade" />
            <button id="createTableButton" class="button primary" type="button">Cadastrar mesa</button>
          </div>

          <div id="tableList" class="tables-grid" style="margin-top: 22px;"></div>
        </section>
      </main>
    </div>

    <script src="/admin.js"></script>
  </body>
</html>
