<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações - PL Pizzas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="admin-shell admin-shell-alt">
      <button id="adminMenuToggle" class="admin-menu-toggle" type="button" aria-expanded="false" aria-label="Abrir menu administrativo">☰</button>
      <aside id="adminSidebar" class="admin-sidebar open">
        <div class="admin-brand">
          <img class="brand-logo brand-logo-admin" src="/logo-pl-real.png" alt="Logo PL Pizzas" />
          <div>
            <strong>PL Pizzas</strong>
            <small>Admin</small>
          </div>
        </div>

        <nav class="admin-nav" aria-label="Menu administrativo">
          <a href="/admin" class="admin-nav-item">Dashboard</a>
          <a href="/admin-mesas.html" class="admin-nav-item">Gerenciamento de Mesas e Cadeiras</a>
          <a href="/admin-clientes.html" class="admin-nav-item">Clientes Cadastrados</a>
          <a href="/admin-produtos.html" class="admin-nav-item">Produtos</a>
          <a href="/admin-pedidos.html" class="admin-nav-item">Pedidos</a>
          <a href="/admin-estoque.html" class="admin-nav-item">Estoque</a>
          <a href="/admin-lucro.html" class="admin-nav-item">Dashboard de Lucro</a>
          <a href="/admin-config.html" class="admin-nav-item active">Configurações</a>
        </nav>
      </aside>

      <main class="admin-content">
        <header class="admin-header">
          <div>
            <span class="eyebrow">Configurações</span>
            <h1 style="margin: 0;">Configuração geral</h1>
          </div>
          <a href="/admin" class="button ghost">Voltar</a>
        </header>

        <section class="admin-card" style="margin-bottom: 24px;">
          <h2 style="margin-top: 0;">Perfil da loja</h2>
          <form id="storeSettingsForm" class="product-form">
            <div class="two-columns">
              <div class="form-group">
                <label for="companyName">Nome da empresa</label>
                <input id="companyName" name="companyName" type="text" />
              </div>
              <div class="form-group">
                <label for="phone">WhatsApp / Telefone</label>
                <input id="phone" name="phone" type="text" />
              </div>
            </div>

            <div class="two-columns">
              <div class="form-group">
                <label for="logoUrl">URL da logo</label>
                <input id="logoUrl" name="logoUrl" type="text" />
              </div>
              <div class="form-group">
                <label for="pixKey">Chave Pix</label>
                <input id="pixKey" name="pixKey" type="text" />
              </div>
            </div>

            <div class="two-columns">
              <div class="form-group">
                <label for="pixOwnerName">Nome do titular da chave Pix</label>
                <input id="pixOwnerName" name="pixOwnerName" type="text" placeholder="Nome que aparece para quem paga" />
              </div>
              <div class="form-group">
                <label for="pixCity">Cidade do titular</label>
                <input id="pixCity" name="pixCity" type="text" placeholder="Ex.: Recife" />
              </div>
            </div>

            <div class="form-group">
              <label for="address">Endereço</label>
              <input id="address" name="address" type="text" />
            </div>

            <div class="two-columns">
              <div class="form-group">
                <label for="deliveryFee">Taxa fixa de entrega</label>
                <input id="deliveryFee" name="deliveryFee" type="number" step="0.01" min="0" />
              </div>
              <div class="form-group">
                <label for="deliveryRule">Regra de entrega</label>
                <select id="deliveryRule" name="deliveryRule">
                  <option value="fixed">Taxa fixa</option>
                  <option value="by-zone">Por bairro / raio</option>
                </select>
              </div>
            </div>

            <label class="checkbox-row" style="margin-top: 8px;">
              <input id="isOpen" name="isOpen" type="checkbox" checked />
              <span>Loja aberta para pedidos</span>
            </label>

            <button class="button primary" type="submit">Salvar configurações</button>
            <div id="storeMessage" class="form-message" aria-live="polite"></div>
          </form>
        </section>

        <section class="admin-card" style="margin-bottom: 24px;">
          <h2 style="margin-top: 0;">Horário de funcionamento</h2>
          <form id="storeHoursForm" class="product-form">
            <div class="stock-grid">
              <div class="stock-item" data-day="0">
                <strong>Domingo</strong>
                <label class="checkbox-row"><input type="checkbox" name="enabled" checked /> Ativado</label>
                <input type="time" name="openTime" />
                <input type="time" name="closeTime" />
              </div>
              <div class="stock-item" data-day="1">
                <strong>Segunda</strong>
                <label class="checkbox-row"><input type="checkbox" name="enabled" checked /> Ativado</label>
                <input type="time" name="openTime" />
                <input type="time" name="closeTime" />
              </div>
              <div class="stock-item" data-day="2">
                <strong>Terça</strong>
                <label class="checkbox-row"><input type="checkbox" name="enabled" checked /> Ativado</label>
                <input type="time" name="openTime" />
                <input type="time" name="closeTime" />
              </div>
              <div class="stock-item" data-day="3">
                <strong>Quarta</strong>
                <label class="checkbox-row"><input type="checkbox" name="enabled" checked /> Ativado</label>
                <input type="time" name="openTime" />
                <input type="time" name="closeTime" />
              </div>
              <div class="stock-item" data-day="4">
                <strong>Quinta</strong>
                <label class="checkbox-row"><input type="checkbox" name="enabled" checked /> Ativado</label>
                <input type="time" name="openTime" />
                <input type="time" name="closeTime" />
              </div>
              <div class="stock-item" data-day="5">
                <strong>Sexta</strong>
                <label class="checkbox-row"><input type="checkbox" name="enabled" checked /> Ativado</label>
                <input type="time" name="openTime" />
                <input type="time" name="closeTime" />
              </div>
              <div class="stock-item" data-day="6">
                <strong>Sábado</strong>
                <label class="checkbox-row"><input type="checkbox" name="enabled" checked /> Ativado</label>
                <input type="time" name="openTime" />
                <input type="time" name="closeTime" />
              </div>
            </div>

            <button class="button primary" type="submit" style="margin-top: 16px;">Salvar horários</button>
          </form>
        </section>

        <section class="admin-card">
          <h2 style="margin-top: 0;">Controle de caixa</h2>
          <form id="cashRegisterForm" class="product-form" style="margin-bottom: 18px;">
            <div class="two-columns">
              <div class="form-group">
                <label for="initialBalance">Saldo inicial</label>
                <input id="initialBalance" name="initialBalance" type="number" step="0.01" min="0" />
              </div>
              <div class="form-group">
                <label for="openedBy">Responsável</label>
                <input id="openedBy" name="openedBy" type="text" placeholder="Nome de quem está abrindo o caixa" />
              </div>
            </div>
            <div class="form-group">
              <label for="notes">Observações</label>
              <input id="notes" name="notes" type="text" />
            </div>
            <button class="button primary" type="submit">Abrir caixa</button>
          </form>

          <div id="cashSummary" class="customer-list" style="margin-bottom: 18px;"></div>

          <form id="cashMovementForm" class="product-form" style="margin-bottom: 18px;">
            <div class="two-columns">
              <div class="form-group">
                <label for="registerId">ID do caixa</label>
                <input id="registerId" name="registerId" type="number" min="1" />
              </div>
              <div class="form-group">
                <label for="type">Tipo</label>
                <select id="type" name="type">
                  <option value="entrada">Entrada</option>
                  <option value="saida">Saída</option>
                  <option value="pix">Pix</option>
                  <option value="cartao">Cartão</option>
                </select>
              </div>
            </div>

            <div class="two-columns">
              <div class="form-group">
                <label for="amount">Valor</label>
                <input id="amount" name="amount" type="number" step="0.01" min="0" />
              </div>
              <div class="form-group">
                <label for="method">Método</label>
                <select id="method" name="method">
                  <option value="dinheiro">Dinheiro</option>
                  <option value="pix">Pix</option>
                  <option value="cartao">Cartão</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="description">Descrição</label>
              <input id="description" name="description" type="text" />
            </div>

            <button class="button secondary" type="submit">Registrar movimento</button>
          </form>

          <div id="movementList"></div>
          <div id="cashMessage" class="form-message" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="/admin-config.js"></script>
  </body>
</html>
